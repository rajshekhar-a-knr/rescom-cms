<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCOM-LEAP — Complete Platform Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --midnight:#0A0E27;--royal:#1E3A8A;--electric:#3B82F6;
            --cyan:#06B6D4;--emerald:#10B981;--amber:#F59E0B;
            --rose:#F43F5E;--purple:#8B5CF6;--neon:#00F0FF;
            --gold:#FBBF24;--white:#FFFFFF;--plat:#F8FAFC;
        }
        html,body{width:100%;height:100%;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif;background:var(--midnight);color:var(--white);overflow:hidden}
        .animated-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(135deg,#0A0E27 0%,#0F1729 100%)}
        .bg-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.10;animation:drift 30s infinite ease-in-out}
        @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(100px,-80px) scale(1.2)}66%{transform:translate(-70px,60px) scale(.8)}}
        .stars{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
        .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s infinite ease-in-out}
        @keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.9;transform:scale(1.4)}}
        #slides-container{position:relative;z-index:1;width:100vw;height:100vh;overflow:hidden}
        .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:clamp(1rem,2.5vh,2.5rem) clamp(1rem,3vw,3rem);opacity:0;pointer-events:none;transition:opacity .6s ease,transform .6s cubic-bezier(.4,0,.2,1)}
        .slide.active{opacity:1;pointer-events:all;transform:translateX(0)!important}
        .slide.enter-right{transform:translateX(100%)}
        .slide.enter-left{transform:translateX(-100%)}
        .slide.exit-left{transform:translateX(-100%);opacity:0}
        .slide.exit-right{transform:translateX(100%);opacity:0}
        .controls{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:1rem;background:rgba(10,14,39,.8);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:50px;padding:.6rem 1.5rem}
        .ctrl-btn{background:none;border:none;color:var(--white);cursor:pointer;padding:.4rem .8rem;border-radius:8px;font-size:1.1rem;transition:all .2s;opacity:.7}
        .ctrl-btn:hover{opacity:1;background:rgba(255,255,255,.12)}
        .slide-counter{font-size:.85rem;color:rgba(255,255,255,.7);font-weight:600;min-width:5rem;text-align:center}
        .progress-wrap{position:fixed;top:0;left:0;right:0;z-index:100;height:3px;background:rgba(255,255,255,.1)}
        .progress-bar{height:100%;background:linear-gradient(90deg,var(--neon),var(--purple));transition:width .4s ease}
        .timer{font-size:.8rem;color:rgba(255,255,255,.5);font-family:'Outfit',monospace}
        .autoplay-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;padding:.4rem 1rem;border-radius:20px;font-size:.8rem;transition:all .2s}
        .autoplay-btn:hover{background:rgba(255,255,255,.2)}
        .autoplay-btn.active{background:linear-gradient(135deg,var(--electric),var(--purple));border-color:transparent}
        .nav-dots{position:fixed;right:1.5rem;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:.4rem}
        .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:all .3s}
        .dot.active{background:var(--neon);width:6px;height:18px;border-radius:3px}
        .dot:hover{background:rgba(255,255,255,.7)}
        /* TITLE */
        .title-slide{text-align:center}
        .title-slide .tagline{font-size:clamp(1.2rem,3vw,2.2rem);color:var(--gold);font-weight:700;margin:.8rem 0;letter-spacing:.06em;animation:fadeUp 1s 0.4s both}
        .title-slide .subtitle{font-size:clamp(1rem,2vw,1.6rem);color:var(--cyan);font-weight:500;animation:fadeUp 1s 0.8s both;max-width:700px}
        .title-slide .stats-row{display:flex;gap:3rem;margin-top:2.5rem;animation:fadeUp 1s 1.2s both}
        .title-stat{text-align:center}
        .title-stat .num{font-family:'Outfit',sans-serif;font-size:2.8rem;font-weight:900;background:linear-gradient(135deg,var(--neon),var(--electric));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .title-stat .lbl{font-size:.8rem;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.1em;margin-top:.2rem}
        @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        /* OVERVIEW */
        .overview-slide{width:100%}
        .slide-header{text-align:center;margin-bottom:2rem}
        .slide-header .eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.2em;color:var(--neon);font-weight:700;margin-bottom:.5rem}
        .slide-header h2{font-family:'Outfit',sans-serif;font-size:clamp(1.8rem,5vw,3.5rem);font-weight:800}
        .modules-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;width:100%;max-width:1200px}
        .mod-chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:.7rem 1rem;text-align:center;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
        .mod-chip::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--chip-color,var(--electric))20,transparent);opacity:0;transition:opacity .3s}
        .mod-chip:hover{transform:translateY(-3px);border-color:var(--chip-color,var(--electric));box-shadow:0 8px 30px rgba(0,0,0,.3)}
        .mod-chip:hover::before{opacity:1}
        .mod-chip .chip-icon{font-size:1.4rem;margin-bottom:.3rem}
        .mod-chip .chip-name{font-size:.72rem;font-weight:600;color:rgba(255,255,255,.9)}
        /* MODULE SLIDES */
        .module-slide{width:100%;max-width:1300px}
        .module-slide .mod-header{display:flex;align-items:flex-start;gap:2rem;margin-bottom:1.8rem}
        .mod-icon-wrap{width:80px;height:80px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0;position:relative;overflow:hidden;animation:iconPop .6s cubic-bezier(.34,1.56,.64,1) both}
        @keyframes iconPop{from{opacity:0;transform:scale(.4) rotate(-20deg)}to{opacity:1;transform:scale(1) rotate(0)}}
        .mod-icon-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2),transparent)}
        .mod-number{font-size:.78rem;text-transform:uppercase;letter-spacing:.2em;font-weight:700;margin-bottom:.3rem;opacity:.7}
        .mod-title{font-family:'Outfit',sans-serif;font-size:clamp(1.8rem,4vw,3rem);font-weight:900;line-height:1.1;animation:slideIn .5s .1s both}
        .mod-tagline{font-size:clamp(.9rem,1.6vw,1.2rem);color:rgba(255,255,255,.6);margin-top:.4rem;font-weight:500;animation:slideIn .5s .2s both}
        @keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
        .mod-description{font-size:clamp(.82rem,1.3vw,1rem);color:rgba(255,255,255,.65);line-height:1.6;margin-bottom:1.5rem;padding:1rem 1.2rem;background:rgba(255,255,255,.04);border-left:3px solid;border-radius:0 8px 8px 0;animation:fadeUp .5s .3s both}
        .submodules-grid{display:grid;gap:.9rem;animation:fadeUp .5s .4s both}
        .submodule-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:1rem 1.2rem;position:relative;overflow:hidden;transition:all .3s}
        .submodule-card:hover{transform:translateX(6px);border-color:rgba(255,255,255,.25)}
        .sub-name{font-weight:700;font-size:.9rem;margin-bottom:.5rem;display:flex;align-items:center;gap:.5rem}
        .funcs-wrap{display:flex;flex-wrap:wrap;gap:.35rem}
        .func-tag{font-size:.72rem;padding:.25rem .65rem;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.8);white-space:nowrap;transition:all .2s}
        .func-tag:hover{background:rgba(255,255,255,.15)}
        /* CLOSER */
        .closer-slide{text-align:center}
        .closer-slide h2{font-family:'Outfit',sans-serif;font-size:clamp(2.5rem,8vw,6rem);font-weight:900;background:linear-gradient(135deg,var(--white),var(--neon),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titlePulse 4s ease-in-out infinite;margin-bottom:1rem}
        @keyframes titlePulse{0%,100%{filter:drop-shadow(0 0 20px rgba(0,240,255,.6))}50%{filter:drop-shadow(0 0 50px rgba(0,240,255,.9))}}
        .closer-slide .sub{font-size:clamp(1rem,2.5vw,1.8rem);color:var(--gold);font-weight:700;margin-bottom:2rem}
        .cta-wrap{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;margin-top:2rem}
        .cta-btn{padding:.9rem 2.2rem;border-radius:50px;font-weight:700;font-size:1rem;cursor:pointer;border:none;transition:all .3s}
        .cta-primary{background:linear-gradient(135deg,var(--electric),var(--purple));color:#fff;box-shadow:0 8px 30px rgba(59,130,246,.4)}
        .cta-primary:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(59,130,246,.6)}
        .cta-secondary{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.3)}
        .cta-secondary:hover{background:rgba(255,255,255,.1)}
        .closer-modules-list{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;max-width:900px;margin:1.5rem 0}
        .closer-chip{font-size:.72rem;padding:.3rem .8rem;border-radius:20px;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7)}
        .grid-2{grid-template-columns:repeat(2,1fr)}
        .grid-3{grid-template-columns:repeat(3,1fr)}
        .grid-1{grid-template-columns:1fr}
        .mod-glow{position:absolute;width:400px;height:400px;border-radius:50%;filter:blur(100px);opacity:.06;right:-100px;top:-100px;pointer-events:none}
        .title-expand{display:flex;flex-direction:column;align-items:center;width:100%}
        .title-divider{width:200px;height:2px;background:linear-gradient(90deg,transparent,var(--neon),transparent);margin:1.2rem auto;animation:fadeUp .8s 1s both}
        .stat-sep{width:1px;height:40px;background:rgba(255,255,255,.15);align-self:center}
        .pill-badge{padding:.35rem 1rem;border-radius:50px;border:1px solid var(--pc,var(--electric));color:var(--pc,var(--electric));font-size:clamp(.7rem,1.1vw,.85rem);font-weight:600;background:rgba(255,255,255,.04);backdrop-filter:blur(10px)}
        #particleCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
        .logo-ring-wrap{position:relative;width:160px;height:160px;margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:center}
        .logo-outer-ring{position:absolute;inset:-12px;border-radius:50%;border:2px solid transparent;background:linear-gradient(135deg,var(--neon),var(--purple),var(--electric)) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude;animation:spinRing 4s linear infinite;opacity:.8}
        .logo-inner-ring{position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;background:linear-gradient(135deg,var(--gold),var(--amber),var(--neon)) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude;animation:spinRing 6s linear infinite reverse;opacity:.6}
        @keyframes spinRing{to{transform:rotate(360deg)}}
        .logo-circle{width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,0.97);display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px rgba(59,130,246,.5),0 0 100px rgba(139,92,246,.3),inset 0 0 30px rgba(255,255,255,.1);animation:logoPulse 3s ease-in-out infinite;overflow:hidden}
        @keyframes logoPulse{0%,100%{box-shadow:0 0 40px rgba(59,130,246,.5),0 0 80px rgba(139,92,246,.3)}50%{box-shadow:0 0 70px rgba(0,240,255,.7),0 0 120px rgba(139,92,246,.5)}}
        .knr-logo-img{width:130px;height:auto;object-fit:contain;animation:logoFloat 4s ease-in-out infinite}
        @keyframes logoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.02)}}
        *{-webkit-text-size-adjust:none;text-size-adjust:none}
        html{font-size:clamp(12px,1.1vw,16px)}
        .module-slide{width:100%;max-width:min(1300px,96vw);padding-bottom:.5rem}
        .submodules-grid{max-height:calc(100vh - 280px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
        .submodules-grid::-webkit-scrollbar{width:4px}
        .submodules-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
        .modules-grid{max-width:min(1200px,95vw)!important}
        .title-slide .stats-row{gap:clamp(1rem,4vw,3rem)}
        .controls{bottom:clamp(.5rem,1.5vh,1.5rem);padding:.5rem 1.2rem;gap:.6rem}
        /* ADD-ON badge */
        .addon-badge{display:inline-block;font-size:.65rem;padding:.2rem .55rem;border-radius:20px;font-weight:700;letter-spacing:.08em;margin-left:.5rem;vertical-align:middle}
    </style>
</head>

function buildBg(){
  const bg=document.getElementById('animBg');
  COLORS.forEach((c,i)=>{
    const d=document.createElement('div');d.className='bg-orb';
    const s=200+Math.random()*400;
    d.style.cssText=`width:${s}px;height:${s}px;background:${c};left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${i*2}s;animation-duration:${25+i*3}s`;
    bg.appendChild(d);
  });
  const sb=document.getElementById('starsBg');
  for(let i=0;i<120;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+1;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*5}s;animation-duration:${2+Math.random()*4}s`;

  }
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

function buildDots(total){
  const wrap=document.getElementById('navDots');
  for(let i=0;i<total;i++){
    const d=document.createElement('div');
    d.className='dot'+(i===0?' active':'');
    d.title=i===0?'Title':i===1?'Overview':i===total-1?'Closer':`Module ${i-1}`;
    d.onclick=()=>goToSlide(i);
    d.dataset.i=i;
    if(total>10&&i>1&&i<total-1&&(i-2)%3!==0){d.style.display='none';}
    wrap.appendChild(d);
  }
}

let current=0;let slides=[];let total=0;
let autoplayTimer=null;let isPlaying=false;
let elapsedSec=0;let timerTick=null;

function goToSlide(n,dir=1){
  if(n<0||n>=total)return;
  const prev=slides[current];
  prev.style.opacity='0';prev.style.transform=dir>0?'translateX(-60px)':'translateX(60px)';
  prev.style.pointerEvents='none';
  setTimeout(()=>{prev.style.transition='none';prev.style.transform='';prev.style.transition='';},600);
  current=n;
  const curr=slides[current];
  curr.style.opacity='0';curr.style.transform=dir>0?'translateX(60px)':'translateX(-60px)';
  curr.style.transition='none';curr.style.pointerEvents='all';
  requestAnimationFrame(()=>{
    curr.style.transition='opacity .5s ease,transform .5s cubic-bezier(.4,0,.2,1)';
    curr.style.opacity='1';curr.style.transform='translateX(0)';
  });
  document.getElementById('slideCounter').textContent=`${current+1} / ${total}`;
  document.getElementById('progressBar').style.width=`${((current+1)/total)*100}%`;
  document.querySelectorAll('.dot').forEach(d=>{d.classList.toggle('active',+d.dataset.i===current);});
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  curr.classList.add('active');
}

function next(){goToSlide((current+1)%total,1);}
function prev(){goToSlide((current-1+total)%total,-1);}

function toggleAutoplay(){
  isPlaying=!isPlaying;
  const btn=document.getElementById('autoplayBtn');
  if(isPlaying){
    btn.textContent='⏸ Pause';btn.classList.add('active');
    autoplayTimer=setInterval(()=>goToSlide((current+1)%total,1),5000);
  }else{
    btn.textContent='▶ Auto';btn.classList.remove('active');
    clearInterval(autoplayTimer);
  }
}

function startTimer(){
  timerTick=setInterval(()=>{
    elapsedSec++;
    const m=Math.floor(elapsedSec/60),s=elapsedSec%60;
    document.getElementById('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  },1000);
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown')next();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')prev();
  if(e.key===' '){e.preventDefault();toggleAutoplay();}
});

let touchX=0;
document.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX);
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)>50){dx<0?next():prev();}
});

document.getElementById('nextBtn').onclick=next;
document.getElementById('prevBtn').onclick=prev;

startTimer();

// PARTICLES
(function(){
  const c=document.getElementById('particleCanvas');
  const ctx=c.getContext('2d');
  const particles=[];
  const cols=['#3B82F6','#06B6D4','#10B981','#8B5CF6','#FBBF24','#F43F5E','#00F0FF'];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  for(let i=0;i<80;i++){
    particles.push({
      x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*2+.5,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,
      col:cols[Math.floor(Math.random()*cols.length)],
      op:Math.random()*.4+.1
    });
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    particles.forEach(p=>{
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.col;ctx.globalAlpha=p.op;ctx.fill();
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=c.width;if(p.x>c.width)p.x=0;
      if(p.y<0)p.y=c.height;if(p.y>c.height)p.y=0;
    });
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
