<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RELcore CRM — Enterprise Business & CRM Platform Presentation</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --midnight: #0A0E27;
            --royal: #1E3A8A;
            --electric: #3B82F6;
            --cyan: #06B6D4;
            --emerald: #10B981;
            --amber: #F59E0B;
            --rose: #F43F5E;
            --purple: #8B5CF6;
            --neon: #00F0FF;
            --gold: #FBBF24;
            --white: #FFFFFF;
            --plat: #F8FAFC;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--midnight);
            color: var(--white);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* BACKGROUND & PARTICLES */
        .animated-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0A0E27 0%, #060B1E 50%, #0F1729 100%);
        }
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(95px);
            opacity: 0.12;
            animation: drift 30s infinite ease-in-out;
        }
        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(120px, -90px) scale(1.2); }
            66% { transform: translate(-80px, 70px) scale(0.85); }
        }
        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: #ffffff;
            animation: twinkle 3s infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.4); }
        }
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* SLIDES CONTAINER */
        #slides-container {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: clamp(1.2rem, 3vh, 3rem) clamp(1.5rem, 4vw, 4rem);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .slide.active {
            opacity: 1;
            pointer-events: all;
            transform: translateX(0) !important;
        }

        /* PROGRESS & CONTROLS */
        .progress-wrap {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--neon), var(--electric), var(--purple), var(--gold));
            transition: width 0.4s ease;
            box-shadow: 0 0 10px var(--neon);
        }
        .controls {
            position: fixed;
            bottom: clamp(0.8rem, 2vh, 1.8rem);
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(10, 14, 39, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 0.5rem 1.6rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 1.1rem;
            transition: all 0.2s;
            opacity: 0.8;
        }
        .ctrl-btn:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
        }
        .slide-counter {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            min-width: 5.5rem;
            text-align: center;
            font-family: 'Outfit', sans-serif;
        }
        .timer {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Outfit', monospace;
        }
        .autoplay-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .autoplay-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .autoplay-btn.active {
            background: linear-gradient(135deg, var(--electric), var(--purple));
            border-color: transparent;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        .nav-dots {
            position: fixed;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        .dot.active {
            background: var(--neon);
            width: 6px;
            height: 20px;
            border-radius: 3px;
            box-shadow: 0 0 10px var(--neon);
        }
        .dot:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        /* TITLE SLIDE LOGO & GLOW */
        .title-slide {
            text-align: center;
            max-width: 1100px;
            width: 100%;
        }
        .logo-ring-wrap {
            position: relative;
            width: 170px;
            height: 170px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-outer-ring {
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: linear-gradient(135deg, var(--neon), var(--purple), var(--electric)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            animation: spinRing 5s linear infinite;
            opacity: 0.85;
        }
        .logo-inner-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px solid transparent;
            background: linear-gradient(135deg, var(--gold), var(--amber), var(--neon)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            animation: spinRing 7s linear infinite reverse;
            opacity: 0.65;
        }
        @keyframes spinRing { to { transform: rotate(360deg); } }
        .logo-circle {
            width: 155px;
            height: 155px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.6), 0 0 100px rgba(139, 92, 246, 0.4);
            animation: logoPulse 3s ease-in-out infinite;
            padding: 18px;
            overflow: hidden;
        }
        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 45px rgba(59, 130, 246, 0.5), 0 0 85px rgba(139, 92, 246, 0.3); }
            50% { box-shadow: 0 0 75px rgba(0, 240, 255, 0.8), 0 0 130px rgba(139, 92, 246, 0.6); }
        }
        .relcore-logo-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            animation: logoFloat 4s ease-in-out infinite;
        }
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.03); }
        }
        .title-slide .tagline {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.4rem, 3.2vw, 2.5rem);
            color: var(--gold);
            font-weight: 800;
            margin: 0.6rem 0 0.3rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .title-slide .subtitle {
            font-size: clamp(1rem, 1.8vw, 1.4rem);
            color: var(--cyan);
            font-weight: 500;
            letter-spacing: 0.08em;
        }
        .title-divider {
            width: 240px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon), transparent);
            margin: 1.2rem auto;
        }
        .title-slide .stats-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(1.5rem, 4vw, 3.5rem);
            margin-top: 2rem;
        }
        .title-stat { text-align: center; }
        .title-stat .num {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2rem, 3.8vw, 3.2rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon), var(--electric));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .title-stat .lbl {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.65);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.4rem;
            font-weight: 600;
        }
        .stat-sep {
            width: 1px;
            height: 40px;
            background: rgba(255, 255, 255, 0.15);
        }
        .pill-badge {
            padding: 0.4rem 1.1rem;
            border-radius: 50px;
            border: 1px solid var(--pc, var(--electric));
            color: var(--pc, var(--electric));
            font-size: clamp(0.72rem, 1.1vw, 0.85rem);
            font-weight: 600;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
        }
        .pill-badge:hover {
            transform: translateY(-3px) scale(1.05);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px var(--pc, var(--electric));
        }

        /* OVERVIEW SLIDE */
        .overview-slide { width: 100%; max-width: 1300px; text-align: center; }
        .slide-header { text-align: center; margin-bottom: 1.5rem; }
        .slide-header .eyebrow {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: var(--neon);
            font-weight: 700;
            margin-bottom: 0.4rem;
        }
        .slide-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.8rem, 4vw, 3.2rem);
            font-weight: 900;
            line-height: 1.1;
        }
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.85rem;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            max-height: calc(100vh - 240px);
            overflow-y: auto;
            padding: 0.5rem 0.2rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }
        .mod-chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 0.75rem 0.9rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .mod-chip::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, var(--chip-color, var(--electric)), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .mod-chip:hover {
            transform: translateY(-4px);
            border-color: var(--chip-color, var(--electric));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 20px var(--chip-color, var(--electric));
        }
        .mod-chip:hover::before { opacity: 0.2; }
        .mod-chip .chip-icon {
            font-size: 1.5rem;
            margin-bottom: 0.35rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .mod-chip .chip-name { font-size: 0.78rem; font-weight: 700; color: rgba(255, 255, 255, 0.95); line-height: 1.25; }

        /* MODULE SLIDE DETAILS */
        .module-slide { width: 100%; max-width: 1300px; position: relative; }
        .mod-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.08;
            right: -100px;
            top: -100px;
            pointer-events: none;
        }
        .mod-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.2rem;
        }
        .mod-icon-wrap {
            width: 75px;
            height: 75px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4), 0 0 25px var(--mod-color, rgba(59, 130, 246, 0.4));
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .mod-number {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 800;
            margin-bottom: 0.2rem;
        }
        .mod-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.7rem, 3.4vw, 2.7rem);
            font-weight: 900;
            line-height: 1.1;
        }
        .mod-tagline {
            font-size: clamp(0.88rem, 1.4vw, 1.15rem);
            color: rgba(255, 255, 255, 0.65);
            font-weight: 500;
            margin-top: 0.2rem;
        }
        .mod-description {
            font-size: clamp(0.84rem, 1.2vw, 0.98rem);
            color: rgba(255, 255, 255, 0.75);
            line-height: 1.6;
            margin-bottom: 1.2rem;
            padding: 0.8rem 1.2rem;
            background: rgba(255, 255, 255, 0.035);
            border-left: 4px solid;
            border-radius: 0 10px 10px 0;
            backdrop-filter: blur(10px);
        }
        .submodules-grid {
            display: grid;
            gap: 0.9rem;
            max-height: calc(100vh - 290px);
            overflow-y: auto;
            padding-right: 0.4rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }
        .submodules-grid.grid-1 { grid-template-columns: 1fr; }
        .submodules-grid.grid-2 { grid-template-columns: repeat(2, 1fr); }
        .submodules-grid.grid-3 { grid-template-columns: repeat(3, 1fr); }
        
        .submodule-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 14px;
            padding: 0.9rem 1.1rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
        }
        .submodule-card:hover {
            transform: translateX(5px);
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        .sub-name {
            font-weight: 800;
            font-size: 0.92rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Outfit', sans-serif;
        }
        .funcs-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }
        .func-tag {
            font-size: 0.73rem;
            padding: 0.28rem 0.7rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: rgba(255, 255, 255, 0.9);
            white-space: nowrap;
            transition: all 0.25s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .func-tag:hover {
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
            border-color: var(--neon);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
        }

        /* CLOSER SLIDE */
        .closer-slide { text-align: center; max-width: 1100px; width: 100%; }
        .closer-slide h2 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2.2rem, 5.5vw, 4.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--white), var(--neon), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.8rem;
            line-height: 1.1;
        }
        .closer-slide .sub {
            font-size: clamp(1.05rem, 2vw, 1.45rem);
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 1.5rem;
        }
        .closer-modules-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            justify-content: center;
            max-width: 1000px;
            margin: 1.2rem auto;
        }
        .closer-chip {
            font-size: 0.73rem;
            padding: 0.32rem 0.8rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.04);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
        }
        .closer-chip:hover {
            transform: translateY(-2px) scale(1.06);
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 0 12px currentColor;
        }
        .cta-wrap {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 1.8rem;
        }
        .cta-btn {
            padding: 0.85rem 2.2rem;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }
        .cta-primary {
            background: linear-gradient(135deg, var(--electric), var(--cyan));
            color: #fff;
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.45);
        }
        .cta-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.65);
        }
        .cta-admin {
            background: linear-gradient(135deg, var(--purple), var(--rose));
            color: #fff;
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.45);
        }
        .cta-admin:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(139, 92, 246, 0.65);
        }
        .cta-secondary {
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .cta-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        /* INTERACTIVE MODAL POPUP DIALOG */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(6, 11, 30, 0.85);
            backdrop-filter: blur(25px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.96));
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 24px;
            width: 100%;
            max-width: 680px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.8), 0 0 45px var(--modal-color, rgba(59, 130, 246, 0.4));
            transform: scale(0.88) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
        }
        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }
        .modal-close {
            position: absolute;
            top: 1.2rem;
            right: 1.4rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal-close:hover {
            background: rgba(244, 63, 94, 0.85);
            transform: rotate(90deg);
        }
        .modal-badge {
            display: inline-block;
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--modal-color, var(--electric));
            color: var(--modal-color, var(--electric));
        }
        .modal-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.4rem, 2.5vw, 2.1rem);
            font-weight: 900;
            color: #ffffff;

function initParticleCanvas() {
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  });

  const particles = [];
  for (let i = 0; i < 50; i++) {
    particles.push({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5,
      size: Math.random() * 2 + 1,
      color: COLORS[i % COLORS.length]
    });
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    particles.forEach((p, i) => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > width) p.vx *= -1;
      if (p.y < 0 || p.y > height) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.4;
      ctx.fill();

      for (let j = i + 1; j < particles.length; j++) {
        const p2 = particles[j];
        const dx = p.x - p2.x, dy = p.y - p2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = p.color;
          ctx.globalAlpha = (1 - dist / 120) * 0.12;
          ctx.stroke();
        }
      }
    });
    requestAnimationFrame(draw);
  }
  draw();
}

          <div class="title-stat"><div class="num">21</div><div class="lbl">Core Modules</div></div>
          <div class="title-stat stat-sep"></div>
          <div class="title-stat"><div class="num">210+</div><div class="lbl">End-to-End Features</div></div>
          <div class="title-stat stat-sep"></div>
          <div class="title-stat"><div class="num">360°</div><div class="lbl">Customer Intelligence</div></div>
          <div class="title-stat stat-sep"></div>
          <div class="title-stat"><div class="num">100%</div><div class="lbl">Multi-Tenant Security</div></div>
        </div>
        <div style="display:flex; gap:0.6rem; justify-content:center; margin-top:1.8rem; flex-wrap:wrap;">
          <span class="pill-badge" style="--pc:var(--electric)" onclick="goToSlide(2)" title="Jump to Executive Dashboard">${getFuturisticSvgIcon('dashboard', '#3B82F6', 16)} Executives</span>
          <span class="pill-badge" style="--pc:var(--emerald)" onclick="goToSlide(5)" title="Jump to Sales & Deals">${getFuturisticSvgIcon('deals', '#10B981', 16)} Sales & Deals</span>
          <span class="pill-badge" style="--pc:var(--amber)" onclick="goToSlide(11)" title="Jump to Finance & Billing">${getFuturisticSvgIcon('billing', '#F59E0B', 16)} Finance & Billing</span>
          <span class="pill-badge" style="--pc:var(--rose)" onclick="goToSlide(13)" title="Jump to Support & Service">${getFuturisticSvgIcon('support', '#F43F5E', 16)} Support & Service</span>
          <span class="pill-badge" style="--pc:var(--purple)" onclick="goToSlide(7)" title="Jump to Marketing Hub">${getFuturisticSvgIcon('marketing', '#8B5CF6', 16)} Marketing Hub</span>
          <span class="pill-badge" style="--pc:var(--cyan)" onclick="goToSlide(18)" title="Jump to Security & Audit">${getFuturisticSvgIcon('rbac', '#06B6D4', 16)} Security & Audit</span>
        </div>
      </div>
    </div>`;
  container.appendChild(t); allSlides.push(t);

  // ── 2. PLATFORM OVERVIEW SLIDE ──
  const ov = document.createElement('div');
  ov.className = 'slide'; ov.dataset.index = 1;
  ov.innerHTML = `
    <div class="overview-slide">
      <div class="slide-header">
        <div class="eyebrow">Platform Architecture</div>
        <h2 style="background:linear-gradient(135deg, #fff, var(--neon)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text">
          21 Core Modules & Feature Suite
        </h2>
        <p style="color:rgba(255, 255, 255, 0.6); margin-top:0.3rem; font-size:0.9rem">Click any module card below to explore full capabilities & features</p>
      </div>
      <div class="modules-grid">
        ${modules.map((m, i) => `
          <div class="mod-chip" style="--chip-color:${m.color}" onclick="goToSlide(${i + 2})" title="${m.name}">
            <div class="chip-icon">${getFuturisticSvgIcon(m.iconKey, m.color, 26)}</div>
            <div class="chip-name">${m.name}</div>
          </div>`).join('')}
      </div>
    </div>`;
  container.appendChild(ov); allSlides.push(ov);

  // ── 3-23. MODULE SLIDES (21 MODULES) ──
  modules.forEach((m, i) => {
    const s = document.createElement('div');
    s.className = 'slide'; s.dataset.index = i + 2;
    const numCols = m.submodules.length <= 2 ? 'grid-1' : m.submodules.length <= 4 ? 'grid-2' : 'grid-3';

    s.innerHTML = `
      <div class="module-slide">
        <div class="mod-glow" style="background:${m.color}"></div>
        <div class="mod-header">
          <div class="mod-icon-wrap" style="--mod-color:${m.color}; background:linear-gradient(135deg, ${m.color}cc, #0a0e27)">
            ${getFuturisticSvgIcon(m.iconKey, '#ffffff', 42)}
          </div>
          <div>
            <div class="mod-number" style="color:${m.color}">MODULE ${String(m.id).padStart(2, '0')} / 21</div>
            <div class="mod-title" style="background:linear-gradient(135deg, #fff, ${m.color}); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text">${m.name}</div>
            <div class="mod-tagline">${m.tagline}</div>
          </div>
        </div>
        <div class="mod-description" style="border-color:${m.color}">${m.desc}</div>
        <div class="submodules-grid ${numCols}">
          ${m.submodules.map((sub) => `
            <div class="submodule-card" onclick="openSubmoduleModal('${sub.name.replace(/'/g, "\\'")}', '${m.name.replace(/'/g, "\\'")}', '${m.color}', '${sub.iconKey}')">
              <div style="position:absolute; left:0; top:0; bottom:0; width:4px; border-radius:2px 0 0 2px; background:${m.color}"></div>
              <div class="sub-name" style="color:${m.color}">
                ${getFuturisticSvgIcon(sub.iconKey || m.iconKey, m.color, 20)} <span>${sub.name}</span>
              </div>
              <div class="funcs-wrap">
                ${sub.funcs.map(f => `<span class="func-tag" style="border-color:${m.color}44; color:rgba(255,255,255,0.9)" onclick="event.stopPropagation(); openFeatureModal('${f.replace(/'/g, "\\'")}', '${sub.name.replace(/'/g, "\\'")}', '${m.name.replace(/'/g, "\\'")}', '${m.color}', '${sub.iconKey}')">${getFuturisticSvgIcon('search', '#00F0FF', 12)} ${f}</span>`).join('')}
              </div>
            </div>`).join('')}
        </div>
      </div>`;
    container.appendChild(s); allSlides.push(s);
  });

  // ── 24. CLOSER SLIDE WITH WEBSITE & ADMIN PORTAL BUTTONS ──
  const cl = document.createElement('div');
  cl.className = 'slide'; cl.dataset.index = modules.length + 2;
  cl.innerHTML = `
    <div class="closer-slide">
      <div style="font-size:0.85rem; text-transform:uppercase; letter-spacing:0.22em; color:var(--neon); font-weight:800; margin-bottom:0.8rem">Transform Your Enterprise</div>
      <h2>Ready to Experience RELcore?</h2>
      <div class="sub">RELcore — Where Every Feature Delivers Maximum ROI & Operational Excellence</div>
      <div class="closer-modules-list">
        ${modules.map((m, i) => `<span class="closer-chip" style="border-color:${m.color}66; color:${m.color}" onclick="goToSlide(${i + 2})" title="Navigate to ${m.name}">${getFuturisticSvgIcon(m.iconKey, m.color, 16)} ${m.name}</span>`).join('')}
      </div>
      <div class="cta-wrap">
        <a href="https://relcore.rescom.in/" target="_blank" class="cta-btn cta-primary">
          ${getFuturisticSvgIcon('multitenant', '#ffffff', 20)} Visit RELcore Website
        </a>
        <a href="https://relcore.rescom.in/admin/login" target="_blank" class="cta-btn cta-admin">
          ${getFuturisticSvgIcon('rbac', '#ffffff', 20)} Visit RELcore Admin Portal
        </a>
        <button class="cta-btn cta-secondary" onclick="goToSlide(0)">&#8592; Back to Cover</button>
        <button class="cta-btn cta-secondary" onclick="goToSlide(1)">View All Modules</button>
      </div>
      <div style="margin-top:2rem; color:rgba(255,255,255,0.45); font-size:0.88rem; font-weight:600">
        21 Core Modules &bull; 210+ Features &bull; Multi-Tenant Operating System &bull; <span style="color:var(--neon)">RELcore CRM</span>
      </div>
    </div>`;
  container.appendChild(cl); allSlides.push(cl);

  return allSlides;
}

// ═════════════════════════════════════════════════════════════════════════
//  INTERACTIVE FEATURE POPUP MODAL GENERATOR & CONTROLLER
// ═════════════════════════════════════════════════════════════════════════
function openFeatureModal(featureName, subName, modName, color, iconKey) {
  const modal = document.getElementById('featureModal');
  const card = document.getElementById('modalCard');
  card.style.setProperty('--modal-color', color || '#3B82F6');

  document.getElementById('modalModBadge').innerText = modName || 'RELCORE MODULE';
  document.getElementById('modalModBadge').style.borderColor = color;
  document.getElementById('modalModBadge').style.color = color;
  document.getElementById('modalTitle').innerHTML = `${getFuturisticSvgIcon(iconKey || 'dashboard', color, 28)} <span>${featureName}</span>`;
  document.getElementById('modalSubTitle').innerText = `Submodule: ${subName} • Enterprise Capability Deep Dive`;

  const details = generateFeatureDeepDive(featureName, subName, modName);

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-section" style="border-left: 4px solid ${color}">
      <div class="modal-section-title" style="color: ${color}">📖 Feature Overview & Purpose</div>
      <p style="font-size: 0.88rem; color: rgba(255, 255, 255, 0.85); line-height: 1.6;">${details.overview}</p>
    </div>

    <div class="modal-section">
      <div class="modal-section-title" style="color: var(--neon)">⚡ Core Technical Capabilities</div>
      <ul class="modal-list">
        ${details.capabilities.map(c => `<li>${c}</li>`).join('')}
      </ul>
    </div>

    <div class="modal-section">
      <div class="modal-section-title" style="color: var(--gold)">🎯 Client Impact & ROI</div>
      <p style="font-size: 0.85rem; color: rgba(255, 255, 255, 0.82); line-height: 1.6;">${details.impact}</p>
    </div>

    <div class="modal-ui-preview">
      <div>
        <strong style="color:${color}; display:block; margin-bottom: 0.2rem;">Live System Status Indicator:</strong>
        <span style="opacity: 0.7;">State: </span> <span style="color:#10B981; font-weight: bold;">ACTIVE & READY</span> &bull; 
        <span style="opacity: 0.7;">Module: </span> ${modName}
      </div>
      <span style="background: rgba(255,255,255,0.1); padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem; color: var(--neon)">RELcore v2.4</span>
    </div>
  `;

  modal.classList.add('active');
}

function openSubmoduleModal(subName, modName, color, iconKey) {
  openFeatureModal(`${subName} Management Suite`, subName, modName, color, iconKey);
}

function closeFeatureModal(e) {
  if (e && e.stopPropagation) e.stopPropagation();
  document.getElementById('featureModal').classList.remove('active');
}

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeFeatureModal();
});

function generateFeatureDeepDive(fName, subName, modName) {
  const key = fName.toLowerCase();
  
  if (key.includes('mfa') || key.includes('totp') || key.includes('qr')) {
    return {
      overview: "Multi-Factor Authentication (MFA) security framework enforcing Time-based One-Time Passwords (TOTP) via authenticator apps (Google Authenticator, Authy) with QR code setup and emergency recovery keys.",
      capabilities: [
        "Interactive QR code generation for 1-click authenticator pairing",
        "Encrypted backup recovery keys for account retrieval",
        "Role-based enforced MFA policy settings (e.g. mandatory MFA for Admins)",
        "Single Sign-On (SSO) and Google OAuth integration compatibility"
      ],
      impact: "Provides 100% protection against credential theft and brute-force access attempts across enterprise teams."
    };
  }

  if (key.includes('approval') || key.includes('discount approval')) {
    return {
      overview: "Multi-tier approval engine (`/approvals`) regulating quote discounts, special commercial pricing, and high-value deal stage transitions before client delivery.",
      capabilities: [
        "Custom approval threshold triggers (e.g. discounts > 15% require Sales Director sign-off)",
        "1-Click approve/reject actions with inline manager notes",
        "Automated notification triggers dispatched to decision makers",
        "Complete approval trail recorded on Customer 360° timeline"
      ],
      impact: "Protects profit margins and guarantees corporate compliance across all commercial quotes."
    };
  }

  if (key.includes('qa') || key.includes('test report') || key.includes('diagnostic')) {
    return {
      overview: "Automated QA Diagnostic & Test Reporting engine (`/qa-test-reports`) executing automated system health checks, database integrity monitors, and API latency audits.",
      capabilities: [
        "Automated QA test suite runner checking database relationships and schema integrity",
        "System latency, queue worker, and external API diagnostic metrics",
        "Exportable PDF/Excel QA compliance reports",
        "Real-time failure alerts dispatched to system administrators"
      ],
      impact: "Ensures 99.99% system uptime, zero silent database corruptions, and immediate resolution of infrastructure anomalies."
    };
  }

  if (key.includes('builder') || key.includes('report builder')) {
    return {
      overview: "Interactive drag-and-drop custom report builder (`/reports/builder`) allowing users to dynamically select CRM entities, join dataset fields, apply multi-condition filters, and visualize custom charts.",
      capabilities: [
        "Drag-and-drop entity and field selector supporting Deals, Accounts, Invoices, Tasks, and Tickets",
        "Dynamic multi-field filter builder with nested AND/OR logical rules",
        "Visual chart generator supporting Bar, Line, Pie, Doughnut, and Table pivot views",
        "Save custom report templates for instant recurring team access and scheduled email exports"
      ],
      impact: "Eliminates reliance on custom SQL queries or developer bandwidth, enabling business analysts to generate custom reports in seconds."
    };
  }

  if (key.includes('myob') || key.includes('accounting sync')) {
    return {
      overview: "2-Way MYOB EXO Accounting Integration synchronizing invoices, customer ledgers, payment statuses, and tax codes directly between RELcore CRM and MYOB.",
      capabilities: [
        "Automated 2-way invoice creation and status sync between RELcore and MYOB",
        "Customer ledger balance alignment and tax code cross-mapping",
        "Automated payment reconciliation reducing accounting ledger mismatches",
        "Error logging and sync history audit trail for financial compliance"
      ],
      impact: "Saves finance teams hours of double data entry and ensures 100% accounting ledger accuracy."
    };
  }

  if (key.includes('kanban') || key.includes('drag & drop')) {
    return {
      overview: "Visual drag-and-drop pipeline interface allowing sales reps to easily advance deals between stages (Qualification, Demo, Proposal, Negotiation, Closed Won). Column totals and conversion metrics update instantly.",
      capabilities: [
        "Interactive drag-and-drop card positioning with real-time column value updates",
        "Automated stage-change triggers (e.g. auto-generate tasks upon moving to 'Proposal')",
        "Probability weighting & win probability calculation per deal stage",
        "Custom stage creation with milestone rules and ownership requirements"
      ],
      impact: "Accelerates deal closure velocity by up to 35% and gives sales managers 100% real-time visibility into pipeline health."
    };
  }

  // Fallback for all other feature tags
  return {
    overview: `Detailed capability overview for '${fName}' under the ${subName} submodule of ${modName}. Fully integrated within the RELcore Enterprise OS framework.`,
    capabilities: [
      `Automated ${fName} workflow processing with real-time state synchronization`,
      `Role-based access permission enforcement and activity audit logging`,
      `Seamless integration with Customer 360° timeline and executive dashboards`,
      `Customizable parameters, automated alerts, and export options (PDF / Excel / CSV)`
    ],
    impact: `Enhances operational efficiency, minimizes manual errors, and provides seamless end-to-end management for ${subName}.`
  };
}

function buildDots(total) {
  const wrap = document.getElementById('navDots');
  wrap.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.title = i === 0 ? 'Cover' : i === 1 ? 'Overview' : i === total - 1 ? 'Conclusion' : `Module ${i - 1}`;
    d.onclick = () => goToSlide(i);
    wrap.appendChild(d);
  }
}

let current = 0;
let slides = [];
let total = 0;
let autoplayTimer = null;
let isPlaying = false;
let elapsedSec = 0;
let timerTick = null;

function goToSlide(n) {
  if (n < 0 || n >= total) return;
  slides[current].classList.remove('active');
  current = n;
  slides[current].classList.add('active');

  // Update counter & progress bar
  document.getElementById('slideCounter').innerText = `${current + 1} / ${total}`;
  const pct = ((current) / (total - 1)) * 100;
  document.getElementById('progressBar').style.width = `${pct}%`;

  // Update dots
  const dots = document.querySelectorAll('.dot');
  dots.forEach((d, idx) => {
    if (idx === current) d.classList.add('active');
    else d.classList.remove('active');
  });
}

function toggleAutoplay() {
  const btn = document.getElementById('autoplayBtn');
  if (isPlaying) {
    clearInterval(autoplayTimer);
    isPlaying = false;
    btn.classList.remove('active');
    btn.innerHTML = '&#9654; Auto';
  } else {
    isPlaying = true;
    btn.classList.add('active');
    btn.innerHTML = '❚❚ Pause';
    autoplayTimer = setInterval(() => {
      if (current < total - 1) {
        goToSlide(current + 1);
      } else {
        goToSlide(0);
      }
    }, 6000);
  }
}

function startTimer() {
  timerTick = setInterval(() => {
    elapsedSec++;
    const m = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
    const s = String(elapsedSec % 60).padStart(2, '0');
    document.getElementById('timer').innerText = `${m}:${s}`;
  }, 1000);
}

// Keyboard Navigation & Touch Swipe
window.addEventListener('keydown', (e) => {
  if (document.getElementById('featureModal').classList.contains('active')) return;
  if (e.key === 'ArrowRight' || e.key === 'Space') {
    goToSlide(current + 1);
  } else if (e.key === 'ArrowLeft') {
    goToSlide(current - 1);
  } else if (e.key === 'Home') {
    goToSlide(0);
  } else if (e.key === 'End') {
    goToSlide(total - 1);
  }
});

let touchStartX = 0;
window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
window.addEventListener('touchend', e => {
  if (document.getElementById('featureModal').classList.contains('active')) return;
  const touchEndX = e.changedTouches[0].screenX;
  if (touchStartX - touchEndX > 50) goToSlide(current + 1);
  if (touchEndX - touchStartX > 50) goToSlide(current - 1);
});

// INITIALIZATION
window.addEventListener('DOMContentLoaded', () => {
  buildBg();
  initParticleCanvas();
  slides = buildSlides();
  total = slides.length;
  buildDots(total);
  goToSlide(0);

  document.getElementById('prevBtn').onclick = () => goToSlide(current - 1);
  document.getElementById('nextBtn').onclick = () => goToSlide(current + 1);
  document.getElementById('autoplayBtn').onclick = toggleAutoplay;

  startTimer();
});
</script>
