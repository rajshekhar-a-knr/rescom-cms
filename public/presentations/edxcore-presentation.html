<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDXcore — Enterprise Learning Ecosystem Presentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --midnight:#0A0E27;--royal:#1E3A8A;--electric:#3B82F6;
            --cyan:#06B6D4;--emerald:#10B981;--amber:#F59E0B;
            --rose:#F43F5E;--purple:#8B5CF6;--neon:#00F0FF;
            --gold:#FBBF24;--white:#FFFFFF;--plat:#F8FAFC;
        }
        html,body{width:100%;height:100%;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif;background:var(--midnight);color:var(--white);overflow:hidden}
        
        /* Animated Background & Particle Canvas */
        .animated-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(135deg,#0A0E27 0%,#0F1729 100%)}
        .bg-orb{position:absolute;border-radius:50%;filter:blur(85px);opacity:.13;animation:drift 30s infinite ease-in-out}
        @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(110px,-90px) scale(1.25)}66%{transform:translate(-80px,70px) scale(.85)}}
        .stars{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
        .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s infinite ease-in-out}
        @keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:.9;transform:scale(1.4)}}
        #particleCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}

        /* Slide Container */
        #slides-container{position:relative;z-index:1;width:100vw;height:100vh;overflow:hidden}
        .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:clamp(1rem,2.5vh,2.5rem) clamp(1rem,3vw,3rem);opacity:0;pointer-events:none;transition:opacity .6s ease,transform .6s cubic-bezier(.4,0,.2,1)}
        .slide.active{opacity:1;pointer-events:all;transform:translateX(0)!important}

        /* Navigation Controls & Deck */
        .controls{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:.85rem;background:rgba(10,14,39,.88);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.15);border-radius:50px;padding:.55rem 1.4rem;box-shadow:0 12px 40px rgba(0,0,0,.6)}
        .ctrl-btn{background:none;border:none;color:var(--white);cursor:pointer;padding:.4rem .8rem;border-radius:8px;font-size:1.05rem;transition:all .2s;opacity:.85;font-weight:600;display:inline-flex;align-items:center;gap:.35rem}
        .ctrl-btn:hover{opacity:1;background:rgba(255,255,255,.15);transform:scale(1.05)}
        .slide-counter{font-size:.85rem;color:rgba(255,255,255,.85);font-weight:700;min-width:5.2rem;text-align:center;font-family:'Outfit',sans-serif}
        .progress-wrap{position:fixed;top:0;left:0;right:0;z-index:100;height:3.5px;background:rgba(255,255,255,.1)}
        .progress-bar{height:100%;background:linear-gradient(90deg,var(--neon),var(--purple),var(--electric));transition:width .4s ease}
        .timer{font-size:.82rem;color:rgba(255,255,255,.65);font-family:'Outfit',monospace;font-weight:700}
        .autoplay-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;padding:.38rem.95rem;border-radius:20px;font-size:.78rem;font-weight:700;transition:all .2s}
        .autoplay-btn:hover{background:rgba(255,255,255,.25)}
        .autoplay-btn.active{background:linear-gradient(135deg,var(--electric),var(--purple));border-color:transparent;box-shadow:0 0 15px rgba(59,130,246,.5)}
        .nav-dots{position:fixed;right:1.4rem;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:.4rem}
        .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:all .3s}
        .dot.active{background:var(--neon);width:6px;height:18px;border-radius:3px;box-shadow:0 0 8px var(--neon)}
        .dot:hover{background:rgba(255,255,255,.8)}

        /* TITLE SLIDE */
        .title-slide{text-align:center;width:100%;max-width:1100px}
        .title-slide .tagline{font-size:clamp(1.2rem,2.8vw,2.2rem);color:var(--gold);font-weight:800;margin:.8rem 0 .3rem;letter-spacing:.06em;animation:fadeUp 1s 0.4s both}
        .title-slide .subtitle{font-size:clamp(1rem,1.8vw,1.45rem);color:var(--cyan);font-weight:600;animation:fadeUp 1s 0.8s both;max-width:820px;margin:0 auto}
        .title-slide .stats-row{display:flex;gap:clamp(1rem,3.5vw,3rem);justify-content:center;align-items:center;margin-top:2.2rem;animation:fadeUp 1s 1.2s both}
        .title-stat{text-align:center}
        .title-stat .num{font-family:'Outfit',sans-serif;font-size:clamp(2rem,4vw,3.2rem);font-weight:900;background:linear-gradient(135deg,var(--neon),var(--electric));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .title-stat .lbl{font-size:.76rem;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.1em;margin-top:.2rem;font-weight:700}
        @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

        /* OVERVIEW SLIDE */
        .overview-slide{width:100%;max-width:1300px}
        .slide-header{text-align:center;margin-bottom:1.2rem}
        .slide-header .eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.2em;color:var(--neon);font-weight:800;margin-bottom:.3rem}
        .slide-header h2{font-family:'Outfit',sans-serif;font-size:clamp(1.8rem,3.8vw,3rem);font-weight:900}
        .modules-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:.75rem;width:100%}
        @media (max-width:1100px){.modules-grid{grid-template-columns:repeat(4,1fr)}}
        @media (max-width:768px){.modules-grid{grid-template-columns:repeat(2,1fr)}}
        .mod-chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:.6rem .75rem;text-align:center;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;backdrop-filter:blur(10px)}
        .mod-chip::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--chip-color,var(--electric))33,transparent);opacity:0;transition:opacity .3s}
        .mod-chip:hover{transform:translateY(-4px);border-color:var(--chip-color,var(--electric));box-shadow:0 8px 30px rgba(0,0,0,.4)}
        .mod-chip:hover::before{opacity:1}
        .mod-chip .chip-icon{font-size:1.25rem;margin-bottom:.2rem}
        .mod-chip .chip-name{font-size:.68rem;font-weight:700;color:rgba(255,255,255,.95);line-height:1.2}

        /* MODULE SLIDES */
        .module-slide{width:100%;max-width:min(1280px,96vw);padding-bottom:.5rem;position:relative}
        .module-slide .mod-header{display:flex;align-items:center;gap:1.6rem;margin-bottom:1.2rem}
        .mod-icon-wrap{width:70px;height:70px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:iconPop .6s cubic-bezier(.34,1.56,.64,1) both}
        @keyframes iconPop{from{opacity:0;transform:scale(.4) rotate(-20deg)}to{opacity:1;transform:scale(1) rotate(0)}}
        .mod-icon-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.25),transparent)}
        .mod-number{font-size:.78rem;text-transform:uppercase;letter-spacing:.2em;font-weight:800;margin-bottom:.2rem;opacity:.8}
        .mod-title{font-family:'Outfit',sans-serif;font-size:clamp(1.5rem,3.2vw,2.7rem);font-weight:900;line-height:1.1;animation:slideIn .5s .1s both}
        .mod-tagline{font-size:clamp(.85rem,1.3vw,1.05rem);color:rgba(255,255,255,.7);margin-top:.2rem;font-weight:600;animation:slideIn .5s .2s both}
        @keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
        .mod-description{font-size:clamp(.8rem,1.15vw,.92rem);color:rgba(255,255,255,.75);line-height:1.5;margin-bottom:1.1rem;padding:.75rem 1.1rem;background:rgba(255,255,255,.04);border-left:4px solid;border-radius:0 10px 10px 0;backdrop-filter:blur(8px);animation:fadeUp .5s .3s both}
        .submodules-grid{display:grid;gap:.8rem;animation:fadeUp .5s .4s both;max-height:calc(100vh - 270px);overflow-y:auto;padding-right:.4rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
        .submodules-grid::-webkit-scrollbar{width:4px}
        .submodules-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}
        .submodule-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:.8rem 1.05rem;position:relative;overflow:hidden;transition:all .3s}
        .submodule-card:hover{transform:translateX(6px);border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.08)}
        .sub-name{font-weight:800;font-size:.86rem;margin-bottom:.4rem;display:flex;align-items:center;gap:.5rem}
        .funcs-wrap{display:flex;flex-wrap:wrap;gap:.35rem}
        .func-tag{font-size:.68rem;padding:.22rem .65rem;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.92);white-space:nowrap;transition:all .2s;font-weight:600;cursor:pointer}
        .func-tag:hover{background:rgba(0,240,255,.22);border-color:var(--neon);color:#fff;transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,240,255,.3)}

        /* CLOSER SLIDE */
        .closer-slide{text-align:center;width:100%;max-width:1050px}
        .closer-slide h2{font-family:'Outfit',sans-serif;font-size:clamp(2rem,5.5vw,4.8rem);font-weight:900;background:linear-gradient(135deg,var(--white),var(--neon),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titlePulse 4s ease-in-out infinite;margin-bottom:.6rem}
        @keyframes titlePulse{0%,100%{filter:drop-shadow(0 0 25px rgba(0,240,255,.6))}50%{filter:drop-shadow(0 0 55px rgba(0,240,255,.9))}}
        .closer-slide .sub{font-size:clamp(1rem,1.8vw,1.5rem);color:var(--gold);font-weight:700;margin-bottom:1.2rem}
        .cta-wrap{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1.5rem}
        .cta-btn{padding:.8rem 1.8rem;border-radius:50px;font-weight:800;font-size:.9rem;cursor:pointer;border:none;transition:all .3s;font-family:'Plus Jakarta Sans',sans-serif;display:inline-flex;align-items:center;gap:.5rem;text-decoration:none}
        .cta-primary{background:linear-gradient(135deg,var(--electric),var(--cyan));color:#fff;box-shadow:0 8px 30px rgba(59,130,246,.4)}
        .cta-primary:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(6,182,212,.6)}
        .cta-glow{background:linear-gradient(135deg,var(--purple),var(--rose));color:#fff;box-shadow:0 8px 30px rgba(139,92,246,.4)}
        .cta-glow:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(244,63,94,.6)}
        .cta-secondary{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.3)}
        .cta-secondary:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.6);transform:translateY(-2px)}
        .closer-modules-list{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;max-width:940px;margin:1rem auto}
        .closer-chip{font-size:.68rem;padding:.25rem .7rem;border-radius:20px;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.8);font-weight:600}
        .grid-2{grid-template-columns:repeat(2,1fr)}
        .grid-3{grid-template-columns:repeat(3,1fr)}
        .grid-1{grid-template-columns:1fr}
        @media (max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}}
        .mod-glow{position:absolute;width:400px;height:400px;border-radius:50%;filter:blur(100px);opacity:.08;right:-100px;top:-100px;pointer-events:none}
        .title-expand{display:flex;flex-direction:column;align-items:center;width:100%}
        .title-divider{width:220px;height:2px;background:linear-gradient(90deg,transparent,var(--neon),transparent);margin:1.2rem auto;animation:fadeUp .8s 1s both}
        .stat-sep{width:1px;height:40px;background:rgba(255,255,255,.2);align-self:center}
        .pill-badge{padding:.35rem 1rem;border-radius:50px;border:1px solid var(--pc,var(--electric));color:var(--pc,var(--electric));font-size:clamp(.7rem,1.1vw,.85rem);font-weight:700;background:rgba(255,255,255,.05);backdrop-filter:blur(10px)}
        
        .logo-ring-wrap{position:relative;width:170px;height:170px;margin:0 auto 1.2rem;display:flex;align-items:center;justify-content:center}
        .logo-outer-ring{position:absolute;inset:-12px;border-radius:50%;border:2px solid transparent;background:linear-gradient(135deg,var(--neon),var(--purple),var(--electric)) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude;animation:spinRing 4s linear infinite;opacity:.85}
        .logo-inner-ring{position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent;background:linear-gradient(135deg,var(--gold),var(--amber),var(--neon)) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude;animation:spinRing 6s linear infinite reverse;opacity:.65}
        @keyframes spinRing{to{transform:rotate(360deg)}}
        .logo-circle{width:155px;height:155px;border-radius:50%;background:rgba(255,255,255,0.98);display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px rgba(59,130,246,.6),0 0 100px rgba(139,92,246,.4),inset 0 0 30px rgba(255,255,255,.2);animation:logoPulse 3s ease-in-out infinite;overflow:hidden;padding:12px}
        @keyframes logoPulse{0%,100%{box-shadow:0 0 40px rgba(59,130,246,.6),0 0 80px rgba(139,92,246,.4)}50%{box-shadow:0 0 75px rgba(0,240,255,.8),0 0 125px rgba(139,92,246,.6)}}
        .edx-logo-img{width:130px;height:auto;object-fit:contain;animation:logoFloat 4s ease-in-out infinite}
        @keyframes logoFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.03)}}

        /* MODAL DIALOGS */
        .modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(10,14,39,.85);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;padding:1.5rem;opacity:0;pointer-events:none;transition:opacity .3s ease}
        .modal-overlay.active{opacity:1;pointer-events:all}
        .modal-card{background:rgba(15,23,42,.95);border:1px solid rgba(255,255,255,.2);border-radius:24px;width:100%;max-width:640px;padding:2rem;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.7);transform:scale(.9);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
        .modal-overlay.active .modal-card{transform:scale(1)}
        .modal-close{position:absolute;right:1.2rem;top:1.2rem;background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
        .modal-close:hover{background:rgba(255,255,255,.25);transform:scale(1.1)}
        .modal-header-badge{display:inline-block;padding:.3rem .8rem;border-radius:20px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.8rem;background:rgba(0,240,255,.12);border:1px solid rgba(0,240,255,.3);color:var(--neon)}
        .modal-title{font-family:'Outfit',sans-serif;font-size:1.8rem;font-weight:900;margin-bottom:.4rem;color:#fff}
        .modal-subtitle{font-size:.9rem;color:rgba(255,255,255,.6);margin-bottom:1.2rem;font-weight:600}
        .modal-desc{font-size:.95rem;color:rgba(255,255,255,.85);line-height:1.65;margin-bottom:1.4rem;padding:1rem;background:rgba(255,255,255,.04);border-radius:12px;border-left:3px solid var(--neon)}
        .modal-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
        .modal-meta-item{background:rgba(255,255,255,.05);padding:.7rem 1rem;border-radius:10px;border:1px solid rgba(255,255,255,.08)}
        .modal-meta-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.5);font-weight:700;margin-bottom:.2rem}
        .modal-meta-value{font-size:.85rem;color:rgba(255,255,255,.95);font-weight:700;font-family:'Outfit',monospace}

        /* SEARCH OVERLAY */
        .search-modal-card{max-width:760px;max-height:85vh;display:flex;flex-direction:column}
        .search-input-wrap{position:relative;margin-bottom:1.2rem}
        .search-input{width:100%;padding:1rem 1.2rem 1rem 3rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:16px;color:#fff;font-size:1.1rem;outline:none;font-family:'Plus Jakarta Sans',sans-serif}
        .search-input:focus{border-color:var(--neon);box-shadow:0 0 20px rgba(0,240,255,.3)}
        .search-icon{position:absolute;left:1.1rem;top:50%;transform:translateY(-50%);font-size:1.2rem;color:rgba(255,255,255,.5)}
        .search-results{overflow-y:auto;max-height:55vh;display:grid;gap:.6rem;padding-right:.4rem}
        .search-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:.8rem 1.1rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:space-between}
        .search-item:hover{background:rgba(0,240,255,.12);border-color:var(--neon);transform:translateX(4px)}
        .search-item-title{font-weight:800;font-size:.92rem;color:#fff}
        .search-item-mod{font-size:.72rem;color:var(--neon);font-weight:700;margin-top:.2rem}
        .search-item-badge{font-size:.72rem;padding:.2rem .6rem;border-radius:20px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);font-weight:600}
    </style>
</head>
<body>

<canvas id="particleCanvas"></canvas>
<div class="animated-bg" id="animBg"></div>
<div class="stars" id="starsBg"></div>
<div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
<div id="slides-container"></div>
<div class="nav-dots" id="navDots"></div>

<div class="controls">
    <button class="ctrl-btn" id="prevBtn" title="Previous Slide (Left Arrow)">&#8592;</button>
    <span class="slide-counter" id="slideCounter">1 / 1</span>
    <button class="ctrl-btn" id="nextBtn" title="Next Slide (Right Arrow)">&#8594;</button>
    <button class="autoplay-btn" id="autoplayBtn" title="Toggle Auto-Play (Spacebar)">▶ Auto</button>
    <button class="ctrl-btn" id="searchBtn" title="Search Features (S key)">🔍 Search</button>
    <button class="ctrl-btn" id="fullscreenBtn" title="Toggle Fullscreen (F key)">⛶</button>
    <span class="timer" id="timer">00:00</span>
</div>

<!-- FEATURE INSPECTOR MODAL -->
<div class="modal-overlay" id="featureModal">
    <div class="modal-card">
        <button class="modal-close" onclick="closeFeatureModal()">&times;</button>
        <span class="modal-header-badge" id="modalBadge">FEATURE INSPECTOR</span>
        <h3 class="modal-title" id="modalTitle">Feature Title</h3>
        <div class="modal-subtitle" id="modalSub">Module / Submodule</div>
        <div class="modal-desc" id="modalDesc">Detailed feature explanation will load here.</div>
        <div class="modal-meta-grid">
            <div class="modal-meta-item">
                <div class="modal-meta-label">TARGET USER ROLE</div>
                <div class="modal-meta-value" id="modalRole">Student / Administrator</div>
            </div>
            <div class="modal-meta-item">
                <div class="modal-meta-label">PLATFORM ENDPOINT</div>
                <div class="modal-meta-value" id="modalRoute">/dashboard</div>
            </div>
        </div>
    </div>
</div>

<!-- GLOBAL SEARCH MODAL -->
<div class="modal-overlay" id="searchModal">
    <div class="modal-card search-modal-card">
        <button class="modal-close" onclick="closeSearchModal()">&times;</button>
        <h3 class="modal-title" style="margin-bottom:1rem">Search EDXcore Features</h3>
        <div class="search-input-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="Type to search modules, submodules or features... (e.g. Quiz, Proctor, Wallet, Gradebook)" oninput="filterSearch()">
        </div>
        <div class="search-results" id="searchResults"></div>
    </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════
//  EDXCORE COMPREHENSIVE PLATFORM MODULES & FEATURES (22 CORE MODULES)
// ══════════════════════════════════════════════════════════════════════
const modules = [
  {
    id:1, name:"SUPER ADMIN & MULTI-TENANCY", icon:"🛡️", color:"#3B82F6",
    tagline:"Multi-Tenant SaaS Architecture & Governance",
    desc:"Complete tenant lifecycle control with isolated branding, global system health metrics, tenant user CSV onboarding, granular RBAC menu builder, and security audit logs.",
    submodules:[
      {name:"Tenant Onboarding & Branding",icon:"🏢",funcs:["Tenant Creation","Subdomain Mapping","Custom Logo & Colors","Theme Playground","Tenant Status Toggles"]},
      {name:"System Health & Audit",icon:"📊",funcs:["Live Health Monitoring","Global Revenue Analytics","Audit Log Viewer","Audit CSV Export","System Action Center"]},
      {name:"User & Access Governance",icon:"🔑",funcs:["Global User Management","Bulk CSV User Import","Import Template Generator","Temporary Password Reset","RBAC Menu Builder"]}
    ]
  },
  {
    id:2, name:"COURSE & CURRICULUM MANAGEMENT", icon:"📚", color:"#10B981",
    tagline:"Flexible Multi-Tier Curriculum Delivery",

const COLORS=["#3B82F6","#10B981","#8B5CF6","#06B6D4","#F59E0B","#F43F5E","#A78BFA","#EC4899","#10B981","#FBBF24","#34D399","#FB923C","#06B6D4","#6366F1","#F97316","#8B5CF6","#3B82F6","#F43F5E","#A78BFA","#10B981","#6366F1","#06B6D4"];

function buildBg(){
  const bg=document.getElementById('animBg');
  COLORS.forEach((c,i)=>{
    const d=document.createElement('div');d.className='bg-orb';
    const s=220+Math.random()*380;
    d.style.cssText=`width:${s}px;height:${s}px;background:${c};left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${i*1.8}s;animation-duration:${25+i*2}s`;
    bg.appendChild(d);
  });
  const sb=document.getElementById('starsBg');
  for(let i=0;i<130;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+.8;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*5}s;animation-duration:${2+Math.random()*4}s`;
    sb.appendChild(s);
  }
}

                ${sub.funcs.map(f=>`<span class="func-tag" style="border-color:${m.color}44;color:rgba(255,255,255,.9)" onclick="openFeatureModal('${f.replace(/'/g,"\\'")}', '${m.name.replace(/'/g,"\\'")}', '${sub.name.replace(/'/g,"\\'")}')">${f}</span>`).join('')}
              </div>
            </div>`).join('')}
        </div>
      </div>`;
    container.appendChild(s);allSlides.push(s);
  });

  // ── CLOSER SLIDE ──
  const cl=document.createElement('div');
  cl.className='slide';cl.dataset.index=modules.length+2;
  cl.innerHTML=`
    <div class="closer-slide">
      <div style="font-size:.85rem;text-transform:uppercase;letter-spacing:.22em;color:var(--neon);font-weight:800;margin-bottom:.6rem">End-To-End Excellence</div>
      <h2>Empower Your Institution with EDXcore</h2>
      <div class="sub">Where Seamless Learning Meets Enterprise Performance</div>
      <div class="closer-modules-list">
        ${modules.map(m=>`<span class="closer-chip" style="border-color:${m.color}66;color:${m.color}">${m.icon} ${m.name}</span>`).join('')}
      </div>
      <div class="cta-wrap">
        <a href="https://edxcore.rescom.in/" target="_blank" class="cta-btn cta-primary">🌐 Visit EDXcore</a>
        <a href="https://edxcore.rescom.in/login" target="_blank" class="cta-btn cta-glow">👑 Visit EDXcore Admin Portal</a>
        <button class="cta-btn cta-secondary" onclick="goToSlide(0)">↺ Back to Start</button>
        <button class="cta-btn cta-secondary" onclick="goToSlide(1)">📱 View All Modules</button>
      </div>
      <div style="margin-top:1.8rem;color:rgba(255,255,255,.45);font-size:.85rem;font-weight:600">
        22 Core Modules &nbsp;&bull;&nbsp; 220+ Features &nbsp;&bull;&nbsp; 6 User Portals &nbsp;&bull;&nbsp; <span style="color:var(--neon)">EDXcore</span>
      </div>
    </div>`;
  container.appendChild(cl);allSlides.push(cl);

  return allSlides;
}

function buildDots(total){
  const wrap=document.getElementById('navDots');
  wrap.innerHTML='';
  for(let i=0;i<total;i++){
    const d=document.createElement('div');
    d.className='dot'+(i===0?' active':'');
    d.title=i===0?'Title Slide':i===1?'Platform Overview':i===total-1?'Summary Slide':`Module ${i-1}`;
    d.onclick=()=>goToSlide(i);
    d.dataset.i=i;
    if(total>12&&i>1&&i<total-1&&(i-2)%2!==0){d.style.display='none';}
    wrap.appendChild(d);
  }
}

let current=0;let slides=[];let total=0;
let autoplayTimer=null;let isPlaying=false;
let elapsedSec=0;let timerTick=null;

function goToSlide(n,dir=1){
  if(n<0||n>=total)return;
  const prev=slides[current];
  prev.style.opacity='0';prev.style.transform=dir>0?'translateX(-60px)':'translateX(60px)';
  prev.style.pointerEvents='none';
  setTimeout(()=>{prev.style.transition='none';prev.style.transform='';prev.style.transition='';},600);
  current=n;
  const curr=slides[current];
  curr.style.opacity='0';curr.style.transform=dir>0?'translateX(60px)':'translateX(-60px)';
  curr.style.transition='none';curr.style.pointerEvents='all';
  requestAnimationFrame(()=>{
    curr.style.transition='opacity .5s ease,transform .5s cubic-bezier(.4,0,.2,1)';
    curr.style.opacity='1';curr.style.transform='translateX(0)';
  });
  document.getElementById('slideCounter').textContent=`${current+1} / ${total}`;
  document.getElementById('progressBar').style.width=`${((current+1)/total)*100}%`;
  document.querySelectorAll('.dot').forEach(d=>{d.classList.toggle('active',+d.dataset.i===current);});
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  curr.classList.add('active');
}

function next(){goToSlide((current+1)%total,1);}
function prev(){goToSlide((current-1+total)%total,-1);}

function toggleAutoplay(){
  isPlaying=!isPlaying;
  const btn=document.getElementById('autoplayBtn');
  if(isPlaying){
    btn.textContent='❚❚ Pause';btn.classList.add('active');
    autoplayTimer=setInterval(()=>goToSlide((current+1)%total,1),5000);
  }else{
    btn.textContent='▶ Auto';btn.classList.remove('active');
    clearInterval(autoplayTimer);
  }
}

function startTimer(){
  timerTick=setInterval(()=>{
    elapsedSec++;
    const m=Math.floor(elapsedSec/60),s=elapsedSec%60;
    document.getElementById('timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  },1000);
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(err=>console.log(err));
  }else{
    if(document.exitFullscreen)document.exitFullscreen();
  }
}

// FEATURE INSPECTOR MODAL
function openFeatureModal(featureName, modName, subName){
  const modal = document.getElementById('featureModal');
  const details = FEATURE_DESCRIPTIONS[featureName] || {
    desc: `EDXcore enterprise feature providing automated ${featureName.toLowerCase()} capabilities with real-time data sync, role-based security controls, and client-ready reporting workflows.`,
    role: "Administrator / Instructor / Student",
    route: `/app/${featureName.toLowerCase().replace(/[^a-z0-9]+/g, '-')}`
  };

  document.getElementById('modalTitle').textContent = featureName;
  document.getElementById('modalSub').textContent = `${modName} • ${subName}`;
  document.getElementById('modalDesc').textContent = details.desc;
  document.getElementById('modalRole').textContent = details.role;
  document.getElementById('modalRoute').textContent = details.route;

  modal.classList.add('active');
}

function closeFeatureModal(){
  document.getElementById('featureModal').classList.remove('active');
}

// SEARCH MODAL
function openSearchModal(){
  const modal = document.getElementById('searchModal');
  modal.classList.add('active');
  const input = document.getElementById('searchInput');
  input.value = '';
  input.focus();
  filterSearch();
}

function closeSearchModal(){
  document.getElementById('searchModal').classList.remove('active');
}

function filterSearch(){
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const resultsContainer = document.getElementById('searchResults');
  resultsContainer.innerHTML = '';

  let matches = 0;
  modules.forEach((mod, modIdx) => {
    mod.submodules.forEach(sub => {
      sub.funcs.forEach(func => {
        if (!query || func.toLowerCase().includes(query) || sub.name.toLowerCase().includes(query) || mod.name.toLowerCase().includes(query)) {
          matches++;
          const item = document.createElement('div');
          item.className = 'search-item';
          item.onclick = () => {
            closeSearchModal();
            goToSlide(modIdx + 2);
          };
          item.innerHTML = `
            <div>
              <div class="search-item-title">${func}</div>
              <div class="search-item-mod">${mod.name} • ${sub.name}</div>
            </div>
            <span class="search-item-badge">Jump to Slide ${modIdx + 3}</span>
          `;
          resultsContainer.appendChild(item);
        }
      });
    });
  });

  if (matches === 0) {
    resultsContainer.innerHTML = `<div style="text-align:center;padding:2rem;color:rgba(255,255,255,.5)">No matching features found for "${query}"</div>`;
  }
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName === 'INPUT') return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')next();
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')prev();
  if(e.key===' '){e.preventDefault();toggleAutoplay();}
  if(e.key==='f'||e.key==='F'){toggleFullscreen();}
  if(e.key==='s'||e.key==='S'){e.preventDefault();openSearchModal();}
  if(e.key==='Escape'){closeFeatureModal();closeSearchModal();}
  if(e.key==='Home')goToSlide(0);
  if(e.key==='End')goToSlide(total-1);
});

let touchX=0;
document.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX);
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)>50){dx<0?next():prev();}
});

buildBg();
slides=buildSlides();
total=slides.length;
buildDots(total);
document.getElementById('slideCounter').textContent=`1 / ${total}`;
document.getElementById('progressBar').style.width=`${(1/total)*100}%`;
document.getElementById('nextBtn').onclick=next;
document.getElementById('prevBtn').onclick=prev;
document.getElementById('autoplayBtn').onclick=toggleAutoplay;
document.getElementById('searchBtn').onclick=openSearchModal;
document.getElementById('fullscreenBtn').onclick=toggleFullscreen;
startTimer();

// PARTICLES
(function(){
  const c=document.getElementById('particleCanvas');
  const ctx=c.getContext('2d');
  const particles=[];
  const cols=['#3B82F6','#06B6D4','#10B981','#8B5CF6','#FBBF24','#F43F5E','#00F0FF'];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  for(let i=0;i<85;i++){
    particles.push({
      x:Math.random()*c.width,y:Math.random()*c.height,
      r:Math.random()*2.2+.5,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,
      col:cols[Math.floor(Math.random()*cols.length)],
      op:Math.random()*.4+.1
    });
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    particles.forEach(p=>{
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.col;ctx.globalAlpha=p.op;ctx.fill();
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=c.width;if(p.x>c.width)p.x=0;
      if(p.y<0)p.y=c.height;if(p.y>c.height)p.y=0;
    });
    ctx.globalAlpha=1;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
