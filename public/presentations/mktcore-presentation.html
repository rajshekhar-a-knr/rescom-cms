<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKTcore — Enterprise Multi-Vendor E-Commerce Platform Presentation</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --midnight: #080D21;
            --deep-slate: #0F172A;
            --royal: #1E3A8A;
            --electric: #2563EB;
            --cyan: #06B6D4;
            --emerald: #10B981;
            --amber: #F59E0B;
            --rose: #F43F5E;
            --purple: #8B5CF6;
            --neon: #00F0FF;
            --gold: #FBBF24;
            --white: #FFFFFF;
            --plat: #F8FAFC;
        }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--midnight);
            color: var(--white);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* BACKGROUND & PARTICLES */
        .animated-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: radial-gradient(circle at 20% 20%, #111A3E 0%, #080D21 60%, #040714 100%);
        }
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.14;
            animation: drift 32s infinite ease-in-out;
        }
        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(140px, -100px) scale(1.25); }
            66% { transform: translate(-90px, 80px) scale(0.85); }
        }
        .stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: #ffffff;
            animation: twinkle 3.5s infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 0.95; transform: scale(1.4); }
        }
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* SLIDES CONTAINER */
        #slides-container {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: clamp(1.2rem, 3vh, 3rem) clamp(1.5rem, 4vw, 4rem);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(20px) scale(0.98);
        }
        .slide.active {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0) scale(1) !important;
        }

        /* PROGRESS BAR */
        .progress-wrap {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--cyan), var(--electric), var(--purple), var(--gold));
            transition: width 0.4s ease;
            box-shadow: 0 0 12px var(--cyan);
        }

        /* BOTTOM CONTROLS BAR */
        .controls {
            position: fixed;
            bottom: clamp(0.8rem, 2vh, 1.8rem);
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: rgba(8, 13, 33, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 50px;
            padding: 0.45rem 1.4rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
            padding: 0.4rem 0.75rem;
            border-radius: 10px;
            font-size: 1.15rem;
            transition: all 0.2s;
            opacity: 0.8;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
        }
        .slide-counter {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 700;
            min-width: 5.5rem;
            text-align: center;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.05em;
        }
        .timer {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Outfit', monospace;
            padding: 0 0.3rem;
        }
        .autoplay-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            cursor: pointer;
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .autoplay-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .autoplay-btn.active {
            background: linear-gradient(135deg, var(--electric), var(--purple));
            border-color: transparent;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.6);
        }
        .overview-toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            cursor: pointer;
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .overview-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: var(--cyan);
        }

        /* SIDE NAVIGATION DOTS */
        .nav-dots {
            position: fixed;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }
        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: all 0.3s;
        }
        .dot.active {
            background: var(--cyan);
            width: 7px;
            height: 22px;
            border-radius: 4px;
            box-shadow: 0 0 12px var(--cyan);
        }
        .dot:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: scale(1.3);
        }

        /* COVER SLIDE */
        .title-slide {
            text-align: center;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .logo-ring-wrap {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-orbit-ring {
            position: absolute;
            inset: 0;
            border: 2px dashed rgba(6, 182, 212, 0.45);
            border-radius: 50%;
            animation: rotateOrbit 22s linear infinite;
        }
        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .logo-orbit-ring-2 {
            position: absolute;
            inset: -10px;
            border: 1px dotted rgba(139, 92, 246, 0.35);
            border-radius: 50%;
            animation: rotateOrbit 30s linear infinite reverse;
        }
        .logo-circle {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(240, 245, 255, 0.95));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            box-shadow: 0 15px 45px rgba(6, 182, 212, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.8);
            position: relative;
            z-index: 2;
        }
        .logo-circle img {
            max-width: 88%;
            max-height: 88%;
            object-fit: contain;
        }
        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1.1rem;
            border-radius: 30px;
            background: rgba(6, 182, 212, 0.12);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--cyan);
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 1rem;
        }
        .title-slide h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2.4rem, 5.5vw, 4.6rem);
            font-weight: 900;
            line-height: 1.08;
            background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 40%, var(--cyan) 75%, var(--purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.6rem;
            letter-spacing: -0.02em;
        }
        .title-slide .tagline {
            font-size: clamp(1.1rem, 2.2vw, 1.55rem);
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 0.8rem;
            letter-spacing: 0.04em;
        }
        .title-slide .subtitle {
            font-size: clamp(0.92rem, 1.5vw, 1.15rem);
            color: rgba(255, 255, 255, 0.7);
            max-width: 820px;
            margin: 0 auto 1.8rem;
            line-height: 1.6;
        }
        .title-divider {
            width: 220px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
            margin: 1.2rem auto;
            border-radius: 2px;
        }
        .title-stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2.2rem;
            margin-top: 1.8rem;
        }
        .t-stat {
            text-align: center;
        }
        .t-stat-num {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.8rem, 3.2vw, 2.6rem);
            font-weight: 900;
            background: linear-gradient(135deg, var(--cyan), var(--electric));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }
        .t-stat-lbl {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 0.2rem;
            font-weight: 600;
        }

        /* GENERAL SLIDE HEADER */
        .slide-inner {
            max-width: 1250px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .mod-header {
            display: flex;
            align-items: center;
            gap: 1.4rem;
            margin-bottom: 1.2rem;
        }
        .mod-icon-wrap {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative;
        }
        .mod-header-text {
            flex-grow: 1;
        }
        .mod-number {
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--mod-color, var(--cyan));
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .mod-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.7rem, 3.2vw, 2.6rem);
            font-weight: 900;
            color: #ffffff;
            line-height: 1.15;
            letter-spacing: -0.01em;
        }
        .mod-tagline {
            font-size: clamp(0.88rem, 1.4vw, 1.05rem);
            color: var(--gold);
            font-weight: 600;
            margin-top: 0.25rem;
        }
        .mod-description {
            font-size: clamp(0.85rem, 1.25vw, 0.96rem);
            color: rgba(255, 255, 255, 0.72);
            line-height: 1.6;
            margin-bottom: 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--mod-color, var(--cyan));
            padding: 0.7rem 1.1rem;
            border-radius: 0 12px 12px 0;
        }

        /* SUBMODULES & CARDS */
        .submodules-grid {
            display: grid;
            gap: 0.9rem;
            width: 100%;
        }
        .submodules-grid.grid-2 { grid-template-columns: repeat(2, 1fr); }
        .submodules-grid.grid-3 { grid-template-columns: repeat(3, 1fr); }
        .submodules-grid.grid-4 { grid-template-columns: repeat(4, 1fr); }

        .submodule-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .submodule-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--mod-color, var(--cyan));
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4), 0 0 20px rgba(6, 182, 212, 0.2);
        }
        .sub-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.65rem;
        }
        .sub-name {
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.02em;
        }
        .funcs-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 0.38rem;
        }
        .func-tag {
            font-size: 0.74rem;
            padding: 0.3rem 0.75rem;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: rgba(255, 255, 255, 0.9);
            white-space: nowrap;
            transition: all 0.22s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .func-tag:hover {
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
            border-color: var(--cyan);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.5);
            transform: translateY(-2px);
        }

        /* OVERVIEW MATRIX GRID SLIDE */
        .overview-slide {
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .overview-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.75rem;
            width: 100%;
        }
        .mod-chip {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 0.85rem 0.7rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.28s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .mod-chip:hover {
            transform: translateY(-4px) scale(1.03);
            background: rgba(255, 255, 255, 0.09);
            border-color: var(--chip-color, var(--cyan));
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 18px var(--chip-color, var(--cyan));
        }
        .mod-chip-num {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--chip-color, var(--cyan));
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.35rem;
        }
        .mod-chip-icon {
            margin-bottom: 0.45rem;
        }
        .mod-chip-title {
            font-family: 'Outfit', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.25;
        }

        /* CLOSER SLIDE */
        .closer-slide {
            text-align: center;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .closer-slide h2 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2.2rem, 5vw, 4.2rem);
            font-weight: 900;
            background: linear-gradient(135deg, #FFFFFF 0%, var(--cyan) 50%, var(--purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.6rem;
            line-height: 1.15;
        }
        .closer-slide .sub {
            font-size: clamp(1rem, 2vw, 1.4rem);
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 1.4rem;
        }
        .closer-chips-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 0.45rem;
            justify-content: center;
            max-width: 980px;
            margin: 1.2rem auto 2rem;
        }
        .closer-chip {
            font-size: 0.75rem;
            padding: 0.35rem 0.85rem;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: rgba(255, 255, 255, 0.88);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.22s;
            cursor: pointer;
        }
        .closer-chip:hover {
            transform: translateY(-2px) scale(1.05);
            border-color: var(--cyan);
            background: rgba(6, 182, 212, 0.18);
            box-shadow: 0 0 12px var(--cyan);
        }
        .cta-wrap {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .cta-btn {
            padding: 0.8rem 1.8rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .cta-primary {
            background: linear-gradient(135deg, var(--cyan), var(--electric));
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(6, 182, 212, 0.4);
        }
        .cta-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 40px rgba(6, 182, 212, 0.6);
        }
        .cta-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
        }
        .cta-secondary:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: #ffffff;
            transform: translateY(-3px);
        }

        /* INTERACTIVE FEATURE MODAL DIALOG */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(4, 7, 20, 0.88);
            backdrop-filter: blur(25px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(24, 33, 56, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            width: 100%;
            max-width: 680px;
            max-height: 88vh;
            overflow-y: auto;
            padding: 2.2rem;
            position: relative;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.8), 0 0 45px var(--modal-color, rgba(6, 182, 212, 0.4));
            transform: scale(0.9) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
        }
        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }
        .modal-close {
            position: absolute;
            top: 1.2rem;
            right: 1.4rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal-close:hover {
            background: rgba(244, 63, 94, 0.85);
            transform: rotate(90deg);
        }
        .modal-badge {
            display: inline-block;
            padding: 0.35rem 0.9rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.6rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--modal-color, var(--cyan));
            color: var(--modal-color, var(--cyan));
        }
        .modal-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.4rem, 2.5vw, 2rem);
            font-weight: 900;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .modal-subtitle {
            font-size: 0.92rem;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 1.4rem;
            font-weight: 500;
        }
        .modal-section {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 1.1rem 1.3rem;
            margin-bottom: 1rem;
        }

function initParticleCanvas() {
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let w = (canvas.width = window.innerWidth);
  let h = (canvas.height = window.innerHeight);

  window.addEventListener('resize', () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  });

  const particles = [];
  const count = Math.min(Math.floor(w / 30), 45);
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      radius: Math.random() * 1.8 + 0.8
    });
  }

  function render() {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(6, 182, 212, 0.45)';
      ctx.fill();

      for (let j = i + 1; j < particles.length; j++) {
        const p2 = particles[j];
        const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
        if (dist < 110) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(6, 182, 212, ${0.18 * (1 - dist / 110)})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(render);
  }
  render();
}

// ═════════════════════════════════════════════════════════════════════════
//  SLIDE NAVIGATION & CONTROLS
// ═════════════════════════════════════════════════════════════════════════
let current = 0;
let slides = [];
let total = 0;
let autoplayTimer = null;
let isPlaying = false;
let elapsedSec = 0;
let timerTick = null;

function buildDots(tot) {
  const wrap = document.getElementById('navDots');
  wrap.innerHTML = '';
  for (let i = 0; i < tot; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.title = i === 0 ? 'Cover' : i === 1 ? 'Overview' : i === tot - 2 ? 'Roadmap' : i === tot - 1 ? 'Conclusion' : `Module ${i - 1}`;
    d.onclick = () => goToSlide(i);
    wrap.appendChild(d);
  }
}

function goToSlide(n) {
  if (n < 0 || n >= total) return;
  slides[current].classList.remove('active');
  current = n;
  slides[current].classList.add('active');

  // Counter & progress bar
  document.getElementById('slideCounter').innerText = `${current + 1} / ${total}`;
  const pct = (current / (total - 1)) * 100;
  document.getElementById('progressBar').style.width = `${pct}%`;

  // Dots update
  const dots = document.querySelectorAll('.dot');
  dots.forEach((d, idx) => {
    if (idx === current) d.classList.add('active');
    else d.classList.remove('active');
  });
}

function toggleAutoplay() {
  const btn = document.getElementById('autoplayBtn');
  if (isPlaying) {
    clearInterval(autoplayTimer);
    isPlaying = false;
    btn.classList.remove('active');
    btn.innerHTML = '&#9654; Auto';
  } else {
    isPlaying = true;
    btn.classList.add('active');
    btn.innerHTML = '❚❚ Pause';
    autoplayTimer = setInterval(() => {
      if (current < total - 1) {
        goToSlide(current + 1);
      } else {
        goToSlide(0);
      }
    }, 6500);
  }
}

function startTimer() {
  timerTick = setInterval(() => {
    elapsedSec++;
    const m = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
    const s = String(elapsedSec % 60).padStart(2, '0');
    document.getElementById('timer').innerText = `${m}:${s}`;
  }, 1000);
}

// ═════════════════════════════════════════════════════════════════════════
//  FEATURE MODAL DIALOG CONTROLS
// ═════════════════════════════════════════════════════════════════════════
function openFeatureModal(fName, modName, subName, color) {
  const modal = document.getElementById('featureModal');
  const card = document.getElementById('modalCard');
  const c = color || '#06B6D4';
  
  card.style.setProperty('--modal-color', c);
  document.getElementById('modalModBadge').innerText = modName;
  document.getElementById('modalTitle').innerHTML = `${getSvgIcon('cart', c, 24)} ${fName}`;
  document.getElementById('modalSubTitle').innerText = `${subName} • MKTcore Technical Engine`;

  const data = getFeatureModalData(fName, modName, subName);

  let capsHtml = '';
  data.capabilities.forEach(cap => {
    capsHtml += `<li>${cap}</li>`;
  });

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-section">
      <div class="modal-section-title">Overview & Functional Purpose</div>
      <p style="font-size: 0.88rem; line-height: 1.65; color: rgba(255,255,255,0.85);">${data.overview}</p>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">Key Technical Capabilities</div>
      <ul class="modal-list">${capsHtml}</ul>
    </div>
    <div class="modal-section" style="border-color: ${c}40; background: ${c}12;">
      <div class="modal-section-title" style="color: #fff;">Operational & Business Impact</div>
      <p style="font-size: 0.88rem; line-height: 1.6; color: #fff; font-weight: 600;">${data.impact}</p>
    </div>
  `;

  modal.classList.add('active');
}

function closeFeatureModal() {
  document.getElementById('featureModal').classList.remove('active');
}

// ═════════════════════════════════════════════════════════════════════════
//  KEYBOARD & TOUCH NAVIGATION
// ═════════════════════════════════════════════════════════════════════════
window.addEventListener('keydown', (e) => {
  if (document.getElementById('featureModal').classList.contains('active')) {
    if (e.key === 'Escape') closeFeatureModal();
    return;
  }
  if (e.key === 'ArrowRight' || e.key === 'Space') {
    goToSlide(current + 1);
  } else if (e.key === 'ArrowLeft') {
    goToSlide(current - 1);
  } else if (e.key === 'Home') {
    goToSlide(0);
  } else if (e.key === 'End') {
    goToSlide(total - 1);
  } else if (e.key === 'o' || e.key === 'O') {
    goToSlide(1); // Jump to Overview
  } else if (e.key === 'f' || e.key === 'F') {
    toggleFullScreen();
  }
});

function toggleFullScreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
}

let touchStartX = 0;
window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
window.addEventListener('touchend', e => {
  if (document.getElementById('featureModal').classList.contains('active')) return;
  const touchEndX = e.changedTouches[0].screenX;
  if (touchStartX - touchEndX > 50) goToSlide(current + 1);
  if (touchEndX - touchStartX > 50) goToSlide(current - 1);
});

// INITIALIZATION
window.addEventListener('DOMContentLoaded', () => {
  buildBg();
  initParticleCanvas();
  slides = buildSlides();
  total = slides.length;
  buildDots(total);
  goToSlide(0);

  document.getElementById('prevBtn').onclick = () => goToSlide(current - 1);
  document.getElementById('nextBtn').onclick = () => goToSlide(current + 1);
  document.getElementById('autoplayBtn').onclick = toggleAutoplay;
  document.getElementById('overviewBtn').onclick = () => goToSlide(1);

  startTimer();
});
</script>
</body>
</html>
